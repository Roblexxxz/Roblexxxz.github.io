<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robux Clicker</title>
    <link rel="stylesheet" href="ui.css">
</head>
<body>
    <div id="robux-clicker-ui">
        <h1>Robux Clicker</h1>
        <p>Click the button to earn Robux!</p>
        <button id="click-button" onclick="addRobux()">Click Me!</button>
        <p>Robux Earned: <span id="robux-count">0</span></p>
        <button id="done-button">Done (the robux you gained will be added to your balance)</button>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>

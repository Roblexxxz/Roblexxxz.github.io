<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Tower Lava Survival</title>
    <link rel="stylesheet" href="ui.css">
    <style>
        #speech-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .speech-bubble {
            position: absolute;
            transform: translate(-50%, -100%);
            background: #ffffff;
            color: #000000;
            font-weight: 800;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 12px;
            border: 2px solid #000000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
            display: none;
        }
    </style>
</head>
<body>
    <div id="speech-bubbles"></div>

    <div id="top-bar-container">
        <div id="prompt-banner">
            <span id="prompt-text">Category: Words starting with "A"</span>
            <div id="timer-badge">15s</div>
        </div>
        <form id="word-form" onsubmit="return false;">
            <input 
                type="text" 
                id="word-input" 
                placeholder="Type your word here..." 
                autocomplete="off" 
                autofocus 
            />
            <button type="submit" id="submit-btn">SUBMIT</button>
        </form>
    </div>

    <div id="leaderboard">
        <div id="leaderboard-title">Pillar Heights</div>
        <div id="player-list"></div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script type="module" src="main.js"></script>
</body>
</html>

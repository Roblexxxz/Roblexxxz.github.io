<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lava Pillar</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; color: #fff; }
        #game-canvas { width: 100vw; height: 100vh; display: block; }
        #ui-container { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; }
        .ui-box { background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 8px; margin-bottom: 10px; }
        #word-form { display: flex; gap: 10px; justify-content: center; }
        #word-input { padding: 8px; font-size: 16px; border-radius: 4px; border: none; }
        #submit-btn { padding: 8px 16px; font-size: 16px; border-radius: 4px; border: none; background: #00e676; cursor: pointer; }
        #player-list { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; width: 180px; }
        .player-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .player-height { color: #00e676; }
        .status-dead { color: #ff1744; }
        #speech-bubbles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .speech-bubble { position: absolute; background: white; color: black; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: none; transform: translate(-50%, -100%); }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <div id="ui-container">
        <div class="ui-box">
            <span id="prompt-text">Category: Words starting with "A"</span>
            <span id="timer-badge">15s</span>
        </div>
        <form id="word-form">
            <input type="text" id="word-input" placeholder="Type your word..." autocomplete="off">
            <button type="submit" id="submit-btn">SUBMIT</button>
        </form>
    </div>

    <div id="player-list"></div>
    <div id="speech-bubbles"></div>

    <script type="module" src="./main.js"></script>
</body>
</html>
